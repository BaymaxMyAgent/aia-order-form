<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Advantage Coaching Challenge</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#d9ae61;
  --gold2:#ffe4a7;
  --bg:#080b10;
  --ink:#f6f1e7;
}

body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0a0e15;
  color:var(--ink);
}

.hero{
  padding:20px;
  max-width:900px;
  margin:auto;
}

.hero img{
  width:100%;
  border-radius:12px;
}

.hero h1{
  font-family:'Playfair Display', serif;
  font-size:clamp(42px,6vw,72px);
  line-height:1.1;
  margin:20px 0;
}

.hero h1 .line1{
  display:block;
  white-space:nowrap;
}

.hero h1 .line2{
  display:block;
  color:var(--gold2);
}

/* MOBILE FIX */
@media(max-width:520px){
  .hero h1{
    font-size:34px;
  }
  .hero h1 .line2{
    font-size:0.9em;
    letter-spacing:-0.02em;
    white-space:nowrap;
  }
}

.lead{
  font-size:18px;
  color:#d8d0c4;
}

.btn{
  display:block;
  margin-top:20px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  padding:16px;
  text-align:center;
  border-radius:999px;
  font-weight:800;
  color:#111;
  text-decoration:none;
}
</style>
</head>

<body>

<section class="hero">
  <img src="assets/tony-igor-dean.png" alt="Banner">

  <h1>
    <span class="line1">The AI Advantage</span>
    <span class="line2">Coaching Challenge</span>
  </h1>

  <p class="lead">
    Tony Robbins, Dean Graziosi and Igor Pogany have created a premium 1 on 1 coaching experience designed to help you get out in front of the AI revolution.
  </p>

  <a href="#" class="btn">Enroll Now</a>
</section>

</body>
</html>
